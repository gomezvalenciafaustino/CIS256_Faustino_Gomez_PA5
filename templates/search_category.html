<!DOCTYPE html>
<html>
<head>
    <title>Search by Category</title>
</head>
<body>

<h2>Search by Category</h2>

<form method="POST">
    <input type="text" name="search_text" placeholder="Enter category">
    <button type="submit">Search</button>
</form>

<h3>Available Categories</h3>
<ul>
    {% for c in categories %}
        <li>{{ c[0] }}</li>
    {% endfor %}
</ul>

</body>
</html>
